<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Lookup</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f7f7fb; }
    header { background: #1f2937; color: white; padding: 16px 24px; }
    h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 720px; margin: 32px auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .row { display: flex; gap: 12px; }
    input[type="text"] { flex: 1; padding: 12px 14px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 1rem; }
    button { padding: 12px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button.primary { background: #2563eb; color: white; }
    button.ghost { background: #e5e7eb; }
    .result { margin-top: 16px; padding: 16px; border: 1px dashed #d1d5db; border-radius: 8px; background: #fafafa; }
    .muted { color: #6b7280; }
    footer { text-align: center; color: #6b7280; padding: 24px; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
    .list { margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; }
  </style>
</head>
<body>
  <header>
    <h1>Multi‑Tier Student Lookup (Nginx → Node/Express → PostgreSQL)</h1>
  </header>
  <main>
    <p class="muted">Enter a Student ID (e.g. <code>650001</code>, <code>650002</code>, <code>650003</code>) to fetch details from the database.</p>
    <div class="row">
      <input id="sid" type="text" placeholder="Student ID e.g. 650001" />
      <button class="primary" id="lookup">Lookup</button>
      <button class="ghost" id="listAll">List All</button>
    </div>
    <div id="out" class="result muted">No request yet.</div>
  </main>
  <footer>
    Frontend in Nginx • Backend in Node.js/Express • Database in PostgreSQL
  </footer>

  <script>
    const out = document.getElementById('out');
    async function lookup() {
      const id = document.getElementById('sid').value.trim();
      if (!id) { out.textContent = 'Please enter a student ID.'; return; }
      out.textContent = 'Loading...';
      try {
        const res = await fetch(`/api/student/${encodeURIComponent(id)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unknown error');
        out.innerHTML = `<strong>Result</strong><br>ID: <code>${data.id}</code><br>Name: ${data.name}<br>Major: ${data.major}<br>Year: ${data.year}`;
        out.classList.remove('muted');
      } catch (err) {
        out.textContent = 'Error: ' + err.message;
        out.classList.add('muted');
      }
    }
    async function listAll() {
      out.textContent = 'Loading...';
      try {
        const res = await fetch('/api/students');
        const rows = await res.json();
        if (!Array.isArray(rows)) throw new Error('Unexpected response');
        out.innerHTML = '<strong>All Students</strong>' + 
          '<table><thead><tr><th>ID</th><th>Name</th><th>Major</th><th>Year</th></tr></thead><tbody>' +
          rows.map(r => `<tr><td><code>${r.id}</code></td><td>${r.name}</td><td>${r.major}</td><td>${r.year}</td></tr>`).join('') +
          '</tbody></table>';
        out.classList.remove('muted');
      } catch (err) {
        out.textContent = 'Error: ' + err.message;
        out.classList.add('muted');
      }
    }
    document.getElementById('lookup').addEventListener('click', lookup);
    document.getElementById('listAll').addEventListener('click', listAll);
    document.getElementById('sid').addEventListener('keydown', (e) => { if (e.key === 'Enter') lookup(); });
  </script>
</body>
</html>

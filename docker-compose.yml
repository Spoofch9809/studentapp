version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: elite-golfapp-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secretpw
      POSTGRES_DB: golfdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d golfdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - golf-network
    ports:
      - "5432:5432"  # Optional: for direct database access

  backend:
    build: ./backend
    container_name: elite-golfapp-backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: appuser
      DB_PASSWORD: secretpw
      DB_NAME: golfdb
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"   # API access on http://localhost:3001
    restart: unless-stopped
    networks:
      - golf-network

  frontend:
    build: ./frontend
    container_name: elite-golfapp-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"     # Golf Management System at http://localhost:8080
    restart: unless-stopped
    networks:
      - golf-network

volumes:
  pgdata:
    driver: local

networks:
  golf-network:
    driver: bridge